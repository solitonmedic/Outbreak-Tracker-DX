name: Build Windows package

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-2022

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Check out LuaJIT
        uses: actions/checkout@v4
        with:
          repository: LuaJIT/LuaJIT
          ref: v2.1
          path: windows/luajit

      - name: Build LuaJIT and the native reader
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere -PathType Leaf)) {
            throw "Visual Studio locator not found: $vswhere"
          }

          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            throw 'Visual Studio C++ x64 build tools were not found.'
          }

          $devCmd = Join-Path $vsInstall 'Common7/Tools/VsDevCmd.bat'
          $batch = Join-Path $env:RUNNER_TEMP 'build-windows.cmd'
          @"
          @echo off
          set "WORKSPACE_ROOT=%CD%"
          call "$devCmd" -arch=x64
          if errorlevel 1 exit /b 1
          cd /d windows\luajit\src
          call msvcbuild.bat
          if errorlevel 1 exit /b 1
          cd /d "%WORKSPACE_ROOT%"
          if not exist "windows\Outbreak Tracker\lib\x64" mkdir "windows\Outbreak Tracker\lib\x64"
          copy /y "windows\luajit\src\lua51.lib" "windows\Outbreak Tracker\lib\x64\lua51.lib"
          if errorlevel 1 exit /b 1
          msbuild "windows\Outbreak Tracker.sln" /m /p:Configuration=Release /p:Platform=x64
          if errorlevel 1 exit /b 1
          "@ | Set-Content -Path $batch -Encoding ascii

          & $batch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download LÖVE 11.5 x64 runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'love-11.5-win64.zip'
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'love-11.5-win64'
          Invoke-WebRequest `
            -Uri 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip' `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          if (-not (Test-Path (Join-Path $runtimeDirectory 'love.exe') -PathType Leaf)) {
            throw "LÖVE 11.5 x64 runtime was not extracted to $runtimeDirectory"
          }

      - name: Download the Windows resource editor
        shell: pwsh
        run: |
          $resourceEditor = Join-Path $env:RUNNER_TEMP 'rcedit-x64.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' `
            -OutFile $resourceEditor
          if (-not (Test-Path $resourceEditor -PathType Leaf)) {
            throw "Windows resource editor was not downloaded to $resourceEditor"
          }

      - name: Build the Windows distribution
        shell: pwsh
        env:
          LOVE_WINDOWS_DIR: '${{ runner.temp }}\love-11.5-win64'
          RCEDIT_PATH: '${{ runner.temp }}\rcedit-x64.exe'
        run: ./windows/package.ps1 -LoveRuntimeDirectory $env:LOVE_WINDOWS_DIR -ResourceEditorPath $env:RCEDIT_PATH -SkipArchive

      - name: Verify the Windows distribution
        shell: pwsh
        run: |
          $distribution = 'windows/build/stage/distribution'
          if (-not (Test-Path $distribution -PathType Container)) {
            throw "Windows distribution not found: $distribution"
          }

          $requiredFiles = @(
            'OutbreakTracker.exe',
            'luaoutbreaktracker.dll',
            'love.dll',
            'lua51.dll',
            'SDL2.dll',
            'OpenAL32.dll',
            'license.txt'
          )
          foreach ($file in $requiredFiles) {
            $path = Join-Path $distribution $file
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Windows distribution is missing $file"
            }
          }

      - name: Upload the Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Outbreak-Tracker-Windows-x64
          # Upload the distribution directory so the artifact needs one extraction.
          path: windows/build/stage/distribution/
          if-no-files-found: error

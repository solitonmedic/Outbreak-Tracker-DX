---
# The globals the tracker's Lua files share, for selene (tests/lint/selene.toml).
# The original tracker modules keep their state in globals (players, fonts,
# screen positions) and define their helpers as global functions; they are
# listed here so that selene reports only names that are not on this list,
# such as typos and new globals. New code should use locals and require() instead.
base: lua51
name: tracker
globals:
  love:
    any: true
  BossCard:
    property: full-write
  DefaultFont:
    property: full-write

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Outbreak Tracker</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
  <header><strong>Outbreak Tracker</strong><span id="connection" role="status">Connecting…</span></header>
  <main><p id="message" role="alert"></p><canvas id="tracker" width="300" height="740" aria-label="Live Outbreak tracker"></canvas></main>
  <details open><summary>Tracker controls</summary><nav id="controls" aria-label="Tracker controls"></nav><p>Controls change the shared view on every connected device. Keyboard shortcuts also work.</p></details>
</body></html>
